name: SENTINEL LAB CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff
      - name: Lint (ruff)
        run: ruff check attackers defense globe reports tests services/threat-intel

  threat-intel-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: migtest
          POSTGRES_DB: migtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:migtest@localhost:5432/migtest
    defaults:
      run:
        working-directory: services/threat-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/threat-intel/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Type-check (mypy)
        run: mypy --ignore-missing-imports app
      # Provider/correlation tests mock the DB, Redis and defense-engine; the Postgres service
      # above is only used by tests/test_migrations.py.
      - name: Run tests
        run: pytest -v

  dashboard-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # --legacy-peer-deps matches dashboard/Dockerfile (openapi-typescript peers on TS 5.x).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  classifier-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test + classifier deps
        run: |
          pip install -r tests/requirements.txt
          pip install -r defense/requirements.txt
      - name: Run unit tests (classifier, detection metrics, globe controls)
        run: pytest tests -v

  network-isolation-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify network isolation (MUST pass before anything else)
        run: bash tests/test_network_isolation.sh

      # The load generators below aim at rate-limiter (which needs defense-engine), so both must be up,
      # otherwise every simulated request fails to connect and the smoke runs prove nothing.
      - name: Bring up target infra, defense and observability
        run: docker compose up -d --build web lb tcp-service dns-udp prometheus defense-engine rate-limiter

      - name: Wait for web target to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:9090/-/ready && break
            sleep 2
          done

      - name: Run a short legitimate-load control simulation
        run: |
          docker compose --profile legit-load run --rm \
            -e DURATION=20 -e RUN_NAME=ci_smoke_legit legit-load

      - name: Run a short HTTP flood simulation end-to-end
        run: |
          docker compose --profile attack-http-flood run --rm \
            -e DURATION=20 -e RUN_NAME=ci_smoke_attack attacker-http-flood

      - name: Re-verify attacker containers still have no external route
        run: bash tests/test_network_isolation.sh

      - name: Tear down
        if: always()
        run: docker compose down -v
