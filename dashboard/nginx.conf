# Production reverse proxy, mirroring the dev-mode Vite proxy in
# vite.config.ts so the browser stays same-origin against both backends.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/threats/ {
        proxy_pass http://threat-intel:9400;
        proxy_set_header Host $host;
    }

    location /api/providers/ {
        proxy_pass http://threat-intel:9400;
        proxy_set_header Host $host;
    }

    location /api/geoip/ {
        proxy_pass http://threat-intel:9400;
        proxy_set_header Host $host;
    }

    # threat-intel's own health check (Stage G Settings page service-health panel).
    location = /health {
        proxy_pass http://threat-intel:9400/health;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://threat-intel:9400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/sandbox/ {
        rewrite ^/api/sandbox/(.*)$ /api/$1 break;
        proxy_pass http://globe:8090;
        proxy_set_header Host $host;
    }

    # defense-engine (Sandbox Lab, port 9300) -- same-origin proxy so the
    # dashboard no longer depends on its CORSMiddleware(allow_origins=["*"])
    # for cross-origin fetches. defense/engine.py itself is unchanged; its
    # routes (/mitigations, /threshold, /health) have no /api prefix of
    # their own, so /api/defense/* is rewritten to strip it.
    location /api/defense/ {
        rewrite ^/api/defense/(.*)$ /$1 break;
        proxy_pass http://defense-engine:9300;
        proxy_set_header Host $host;
    }

    # No trailing slash / path on proxy_pass's target: nginx forwards the
    # full matched URI (including the /grafana/ prefix) unchanged. Grafana
    # is configured with GF_SERVER_SERVE_FROM_SUB_PATH=true (docker-compose.yml),
    # so it expects to see that prefix on every request it receives, not
    # have it stripped -- stripping it here was the cause of "Grafana has
    # failed to load its application files" (asset requests resolved
    # against the dashboard's own origin instead of Grafana's).
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
