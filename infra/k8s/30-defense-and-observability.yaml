apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter
  namespace: sentinel-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: rate-limiter, role: target }
  template:
    metadata:
      labels: { app: rate-limiter, role: target }
    spec:
      containers:
        - name: rate-limiter
          image: sentinel-lab/rate-limiter:latest
          env:
            - { name: UPSTREAM_URL, value: "http://web:8000" }
            - { name: ENGINE_URL, value: "http://defense-engine:9300" }
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rate-limiter
  namespace: sentinel-lab
spec:
  selector: { app: rate-limiter, role: target }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defense-engine
  namespace: sentinel-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: defense-engine, role: target }
  template:
    metadata:
      labels: { app: defense-engine, role: target }
    spec:
      containers:
        - name: defense-engine
          image: sentinel-lab/defense-engine:latest
          env:
            - { name: PROMETHEUS_URL, value: "http://prometheus:9090" }
          ports:
            - containerPort: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: defense-engine
  namespace: sentinel-lab
spec:
  selector: { app: defense-engine, role: target }
  ports:
    - port: 9300
      targetPort: 9300
