worker_processes auto;
events { worker_connections 1024; }

http {
  # Re-resolve the "web" service name on every request (Docker's embedded
  # DNS at 127.0.0.11 rotates the returned replica IPs), which spreads
  # traffic across all web replicas without needing a static upstream list.
  resolver 127.0.0.11 valid=5s;

  server {
    listen 8000;
    location / {
      set $upstream http://web:8000;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 3s;
    }
  }
}
